# Builds the Windows app on a GitHub-hosted Windows runner (Flutter can only
# build Windows apps on Windows) and publishes it as a GitHub Release.
#
# The version comes from app/pubspec.yaml (`version: 1.2.3+4`).
#   - Push a tag:   bump the version, commit, then
#                   git tag v1.2.3 && git push origin v1.2.3   (must match pubspec)
#   - Or by hand:   Actions -> Windows app -> Run workflow. The tag v<pubspec
#                   version> is created on the selected branch's latest commit.
#
# Release asset: MyTermi-windows-x64-<version>.zip (unzip, run mytermi.exe).
name: Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: Default sync server baked into the build (empty = repository variable MYTERMI_API_URL, else https://mytermi.vanminhso.vn)
        required: false

permissions:
  contents: write # create the tag and the release

concurrency:
  group: windows-release-${{ github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      API_URL: ${{ inputs.api_url || vars.MYTERMI_API_URL || 'https://mytermi.vanminhso.vn' }}
    steps:
      # Checkout first: every run step uses working-directory app/.
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)(\+\d+)?\s*$' | Select-Object -First 1
          if (-not $line) { throw "pubspec.yaml needs 'version: 1.2.3+4'" }
          $version = "v$($line.Matches[0].Groups[1].Value)"
          if ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref_name }}' -ne $version) {
            throw "Tag ${{ github.ref_name }} doesn't match pubspec.yaml version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # keep in sync with app/.fvmrc
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build
        shell: pwsh
        run: |
          # Version and build number come from pubspec.yaml.
          flutter build windows --release `
            --dart-define=APP_ENV=prod --dart-define=API_URL=$env:API_URL
          Compress-Archive -Force -Path build\windows\x64\runner\Release\* `
            -DestinationPath "build\windows\MyTermi-windows-x64-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MyTermi-windows-x64-${{ env.VERSION }}
          path: app/build/windows/x64/runner/Release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MyTermi ${{ env.VERSION }}
          generate_release_notes: true
          files: app/build/windows/MyTermi-windows-x64-${{ env.VERSION }}.zip
          body: |
            ## Windows
            Download **MyTermi-windows-x64-${{ env.VERSION }}.zip**, unzip it anywhere and run `mytermi.exe`.
            Windows may show a SmartScreen warning because the app isn't code-signed yet: choose *More info → Run anyway*.

            Default sync server: `${{ env.API_URL }}` (change it in the app under Settings → Sign in / Create account → Sync server).
