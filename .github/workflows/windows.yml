# Builds the Windows app on a GitHub-hosted Windows runner (Flutter can only
# build Windows apps on Windows) and publishes it as a GitHub Release.
#
#   - Push a tag:   git tag v1.0.1 && git push origin v1.0.1
#   - Or by hand:   Actions -> Windows app -> Run workflow, enter the version.
#                   The tag is created on the selected branch's latest commit.
#
# Release asset: MyTermi-windows-x64-<version>.zip (unzip, run mytermi.exe).
name: Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.0.1
        required: true
      api_url:
        description: Default sync server baked into the build (empty = repository variable MYTERMI_API_URL, else https://mytermi.vanminhso.vn)
        required: false

permissions:
  contents: write # create the tag and the release

concurrency:
  group: windows-release-${{ github.ref_name }}-${{ inputs.version }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      API_URL: ${{ inputs.api_url || vars.MYTERMI_API_URL || 'https://mytermi.vanminhso.vn' }}
    steps:
      # Checkout first: every run step uses working-directory app/.
      - uses: actions/checkout@v4

      - name: Check version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must look like v1.2.3, got '$env:VERSION'" }

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # keep in sync with app/.fvmrc
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build
        shell: pwsh
        run: |
          $name = $env:VERSION.Substring(1)   # v1.2.3 -> 1.2.3 (exe file/product version)
          flutter build windows --release `
            --build-name=$name --build-number=${{ github.run_number }} `
            --dart-define=APP_ENV=prod --dart-define=API_URL=$env:API_URL
          Compress-Archive -Force -Path build\windows\x64\runner\Release\* `
            -DestinationPath "build\windows\MyTermi-windows-x64-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MyTermi-windows-x64-${{ env.VERSION }}
          path: app/build/windows/x64/runner/Release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MyTermi ${{ env.VERSION }}
          generate_release_notes: true
          files: app/build/windows/MyTermi-windows-x64-${{ env.VERSION }}.zip
          body: |
            ## Windows
            Download **MyTermi-windows-x64-${{ env.VERSION }}.zip**, unzip it anywhere and run `mytermi.exe`.
            Windows may show a SmartScreen warning because the app isn't code-signed yet: choose *More info → Run anyway*.

            Default sync server: `${{ env.API_URL }}` (change it in the app under Settings → Sign in / Create account → Sync server).
