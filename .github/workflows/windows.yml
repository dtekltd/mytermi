# Builds the Windows app on a GitHub-hosted Windows runner (Flutter can only
# build Windows apps on Windows).
#
#   - "Run workflow" button (Actions tab): manual build, optionally pointing at
#     a sync server. The zip is uploaded as a workflow artifact
#     (run -> Artifacts -> MyTermi-windows-x64).
#   - Pushing a v* tag: same build, and the zip is attached to a GitHub Release.
name: Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: Default sync server URL baked into the build (optional)
        required: false

permissions:
  contents: write # attach the zip to releases

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # keep in sync with app/.fvmrc
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build
        shell: pwsh
        env:
          API_URL: ${{ inputs.api_url || vars.MYTERMI_API_URL }}
        run: |
          $defines = @('--dart-define=APP_ENV=prod')
          if ($env:API_URL) { $defines += "--dart-define=API_URL=$env:API_URL" }
          flutter build windows --release @defines
          Compress-Archive -Force -Path build\windows\x64\runner\Release\* -DestinationPath build\windows\MyTermi-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MyTermi-windows-x64
          path: app/build/windows/x64/runner/Release/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/windows/MyTermi-windows-x64.zip
